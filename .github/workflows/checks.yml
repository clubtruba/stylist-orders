name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stylist_test
          POSTGRES_USER: stylist_test
          POSTGRES_PASSWORD: stylist_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stylist_test -d stylist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://stylist_test:stylist_ci_test@localhost:5432/stylist_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m compileall -q app ../bot/app
  mini-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - run: npm ci
      - run: npm run build
